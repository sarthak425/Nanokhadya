spring.application.name=food-adulterant-backend
server.port=8080

# Profiles: default is dev (using in-memory H2 with MySQL syntax compatibility)
# Set SPRING_PROFILES_ACTIVE=mysql to connect to external MySQL server
spring.profiles.active=dev

# Common JPA Settings
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security JWT Configuration
app.jwt.secret=9a6747b9e113b552add14a473026756658605f7c4eb96a3019d26a7166004c3e720e6f
app.jwt.expiration-ms=86400000

# FastApi Computer Vision Service URL
app.cv-service.url=http://localhost:8000

# Swagger OpenAPI UI Path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
